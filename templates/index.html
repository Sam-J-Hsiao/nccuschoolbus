<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>政大2路 公車動態資訊</title>
    <style>
        body, td, th { font-size: 14px; font-family: sans-serif; }
        table { border-collapse: collapse; }
        .formattable1 { border: 0px; width: 100%; max-width: 800px; margin: 0 auto; }
        .title2 { font-size: 16px; color: darkblue; background-color: lightblue; padding: 5px; }
        .title3 { font-size: 16px; color: darkblue; background-color: lightgreen; padding: 5px; text-align: center; }
        .updatetime { font-size: 14px; font-weight: normal; color: black; }
        
        /* 去程與返程的標題顏色 */
        .ttegotitle { background-color: blue; color: yellow; text-align: center; font-weight: bold; padding: 5px; }
        .ttebacktitle { background-color: green; color: yellow; text-align: center; font-weight: bold; padding: 5px; }
        
        /* 站牌列表的交替底色 (還原截圖視覺) */
        .ttego1 { background-color: #A9F5F2; }
        .ttego2 { background-color: #01DFD7; }
        .tteback1 { background-color: #D0F5A9; }
        .tteback2 { background-color: lightgreen; }
        
        td { padding: 4px 8px; border: 1px solid white; }
        a { text-decoration: none; color: blue; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<table class="formattable1">
    <tr>
        <th class="title2">查詢公車動態資訊</th>
    </tr>
    <tr>
        <th class="title3">
            <a href="#">政大2路</a><br>
            <span class="updatetime">
                (更新時間：{{ update_time }} <button onclick="location.reload();">立刻更新</button>)
            </span>
        </th>
    </tr>
</table>
    
<table class="formattable1">
    <tr>
        <td width="50%" class="ttegotitle">去程 (往六期運動場)</td>
        <td width="50%" class="ttebacktitle">返程 (往行政大樓)</td>
    </tr>
    <tr>
        <td valign="top">
            <table width="100%">
                {% for stop in go_stops %}
                <!-- 使用 loop.cycle 來達成交替換色效果 -->
                <tr class="{{ loop.cycle('ttego1', 'ttego2') }}">
                    <td><a href="#">{{ stop.name }}</a></td>
                    <td align="center">{{ stop.status }}</td>
                </tr>
                {% endfor %}
            </table>
        </td>
        <td valign="top">
            <table width="100%">
                {% for stop in back_stops %}
                <tr class="{{ loop.cycle('tteback1', 'tteback2') }}">
                    <td><a href="#">{{ stop.name }}</a></td>
                    <td align="center">{{ stop.status }}</td>
                </tr>
                {% endfor %}
            </table>
        </td>
    </tr>
</table>

</body>
</html>
